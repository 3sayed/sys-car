<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>infiCarX Assembly Studio</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b1118;color:#edf3f8;font:14px system-ui;overflow:hidden}#scene{width:100vw;height:100vh;display:block;touch-action:none}.top{position:absolute;top:20px;left:22px;pointer-events:none}.tag{font-size:10px;letter-spacing:2px;color:#b4ef65}h1{font-size:19px;margin:8px 0}#selection{color:#91a4b5;font-size:12px}.controls{position:absolute;bottom:18px;left:18px;right:18px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;border:1px solid #293846;border-radius:14px;background:#121d28ed}button{border:0;border-radius:7px;padding:10px 12px;background:#263846;color:#e8f1f7;font-weight:650;cursor:pointer}button.primary{background:#b4ef65;color:#0b1118}button:disabled{opacity:.4;cursor:default}#step{flex:1;font-size:12px;min-width:110px}#error{position:absolute;top:45%;left:10%;right:10%;color:#ff8e8e;text-align:center}.hint{position:absolute;right:18px;top:22px;color:#647c90;font-size:10px;letter-spacing:1px}@media(max-width:500px){.hint{display:none}.controls{gap:5px;padding:8px}button{padding:9px;font-size:11px}}</style></head>
<body><canvas id="scene" aria-label="Interactive 3D assembly"></canvas><div class="top"><div class="tag">ASSEMBLY STUDIO / 01</div><h1>Brake assembly</h1><div id="selection">Select a component to inspect</div></div><div class="hint">DRAG TO ORBIT · SCROLL TO ZOOM</div><div id="error" role="alert"></div><div class="controls"><button id="previous" aria-label="Previous step">←</button><span id="step">01 / 05 · Assembled view</span><button id="next" aria-label="Next step">→</button><button id="play" class="primary">Play</button><button id="reset">Reset view</button></div><script type="module" src="./viewer.js"></script></body></html>
