name: inficarx
x-backend: &backend
  build:
    context: .
    dockerfile: infrastructure/docker/Dockerfile
    target: app
  env_file: .env
  environment: &backend-env
    APP_URL: http://localhost:8000
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: inficarx
    DB_USERNAME: inficarx
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in admin .env}
    REDIS_HOST: redis
    QUEUE_CONNECTION: redis
    CACHE_STORE: redis
    REDIS_QUEUE_RETRY_AFTER: 300
    SIMULATION_ENGINE_URL: http://simulation:8090
    SIMULATION_ENGINE_TOKEN: ${SIMULATION_ENGINE_TOKEN:?Set SIMULATION_ENGINE_TOKEN in admin .env}
  volumes:
    - app-storage:/var/www/html/storage
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
services:
  app:
    <<: *backend
  queue:
    <<: *backend
    command:
      [
        "php",
        "artisan",
        "queue:work",
        "--timeout=240",
        "--tries=2",
        "--sleep=3",
      ]
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: web
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - app-storage:/var/www/html/storage:ro
    depends_on:
      - app
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: inficarx
      MYSQL_USER: inficarx
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  simulation:
    build:
      context: .
      dockerfile: infrastructure/docker/simulation.Dockerfile
    environment:
      SIMULATION_ENGINE_TOKEN: ${SIMULATION_ENGINE_TOKEN:?Set SIMULATION_ENGINE_TOKEN}
    mem_limit: 2g
    cpus: 2
    read_only: true
    tmpfs:
      - /tmp:size=512m
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-inficarx}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
volumes:
  app-storage:
  mysql-data:
  redis-data:
  minio-data:
